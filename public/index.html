<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Snake Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Lobby -->
    <div id="lobby" class="screen">
      <h1>Snake Online</h1>
      <p class="subtitle">Up to 4 players · Play anywhere</p>

      <div class="share-box">
        <p class="share-label">Share this link with friends:</p>
        <div class="share-url" id="shareUrl">Connecting...</div>
        <button class="btn-copy" id="copyBtn">Copy link</button>
      </div>

      <div class="name-row">
        <input type="text" id="nameInput" placeholder="Your name" maxlength="12" autocomplete="off">
      </div>

      <div id="playerList" class="player-list"></div>

      <div id="lobbyStatus" class="lobby-status"></div>

      <button id="readyBtn" class="btn-ready">Ready</button>
    </div>

    <!-- Game -->
    <div id="gameScreen" class="screen hidden">
      <div class="hud">
        <span id="hudStatus"></span>
        <span id="hudScore"></span>
      </div>
      <canvas id="canvas"></canvas>

      <div id="controls" class="controls">
        <button class="ctrl-btn" data-dir="up">▲</button>
        <div class="ctrl-row">
          <button class="ctrl-btn" data-dir="left">◀</button>
          <button class="ctrl-btn" data-dir="down">▼</button>
          <button class="ctrl-btn" data-dir="right">▶</button>
        </div>
      </div>
    </div>

    <!-- Game Over -->
    <div id="gameOver" class="screen hidden overlay">
      <div class="overlay-card">
        <h2 id="gameOverTitle">Game Over</h2>
        <div id="finalScores"></div>
        <button id="playAgainBtn" class="btn-ready">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
